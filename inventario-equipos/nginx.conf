server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Angular usa routing del lado del cliente: cualquier ruta desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El backend Express vive en otro contenedor de la red de docker-compose
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # El service worker no debe cachearse para que las actualizaciones lleguen
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }
}
